<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lo que siento por ti</title>
<link rel="icon" type="image/png" href="i-love-you-.jpg">

<style>
  :root {
    --primary: #46b1ef;
    --primary-glow: rgba(47, 49, 148, 0.712);
    --secondary: #8b5cf6;
    --bg-dark: #0f1016;
    --card-bg: rgba(255, 255, 255, 0.07);
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top center, #1b1e4b 0%, #0d0222 100%);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-x: hidden;
    padding: 30px 15px;
  }

  #corazones {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 0;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: var(--bg-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;
    z-index: 100;
    transition: opacity 0.6s ease;
    font-size: 1.2rem;
    letter-spacing: 2px;
    color: #e2e8f0;
  }

  .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .main-card {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 650px;
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 30px 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    transition: opacity 0.8s ease;
    margin-bottom: 25px;
  }

  h1 {
    font-weight: 700;
    background: linear-gradient(135deg, #ffffff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 35px rgb(140, 0, 255);
    font-size: clamp(24px, 5vw, 38px);
    margin-bottom: 20px;
  }

  #escena {
    width: 100%;
    height: 80px;
    perspective: 1000px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 15px;
  }

  #rueda {
    width: 200px;
    height: 50px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  #rueda button {
    position: absolute;
    inset: 0;
    border: none;
    background: linear-gradient(135deg, #a855f7);
    color: white;
    font-size: 1.1rem;
    font-weight: 600;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 4px 20px var(--primary-glow);
    transition: all 0.5s ease;
  }

  .controles {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
  }

  .btn-control {
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: white;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-control:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
  }

  #frase-box {
    width: 100%;
    height: 220px;
    background: rgba(0, 0, 0, 0.25);
    border-radius: 16px;
    padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    overflow-y: auto;
    scroll-behavior: smooth;
    text-align: center;
    color: var(--text-sub);
    font-size: 1.05rem;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
  }

  ::-webkit-scrollbar {
    width: 6px;
    height: 6px;
  }

  ::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.03);
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb {
    background: rgba(168, 85, 247, 0.5);
    border-radius: 10px;
  }

  ::-webkit-scrollbar-thumb:hover {
    background: rgba(168, 85, 247, 0.8);
  }

  #frase p {
    margin-bottom: 12px;
    animation: fadeIn 0.4s ease forwards;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }
</style>
</head>

<body>

<canvas id="corazones"></canvas>

<div id="loader">
  <div class="spinner"></div>
  <span>Solo espera...</span>
</div>

<!-- SECCIÓN PRINCIPAL: RUEDA -->
<div class="main-card" id="contenido">
  <h1>Lo que siento por ti</h1>

  <div id="escena">
    <div id="rueda">
      <button>Holi</button>
      <button>Antes</button>
      <button>Durante</button>
      <button>Después</button>
      <button>Infinito</button>
      <button>The end</button>
    </div>
  </div>

  <div class="controles">
    <button class="btn-control" onclick="cambiarIndice(-1)">← Anterior</button>
    <button class="btn-control" onclick="cambiarIndice(1)">Siguiente →</button>
  </div>

  <div id="frase-box" onclick="avanzarFrase()">
    <div id="frase"></div>
  </div>
</div>

<script>
const frases = {
"Holi": [
    "Hola, mi niña hermosa. ¿Cómo estás? Espero que muy bien...",
    "Buenoooo, este es un pequeño proyecto que hice para expresar lo que siento por ti de una forma diferente y divertida. Espero যে te guste y te saque una sonrisa.",
    "Te preguntarás: ¿Qué piñatas es todo esto? Pues, ¿recuerdas que me pediste una página donde pongas tus emociones y te dé frases?",
    "Pues tomé esa idea y la convertí en algo un poco mejor (espero). Es un recorrido de lo que hemos pasado juntos, el cómo me enamoré de ti y, a su vez, es un recordatorio de lo mucho que te amo.",
    "Así que, sin nada más que decir, espero que te guste este detalle y que nunca olvides lo mucho que te amo y lo importante que eres para mí.",
    "Pasa a la siguiente parte para empezar."
],

"Antes": [
    "Hablaré de la primera vez que nos conocimos, y de lo que tengo memoria, porque al parecer nos conocíamos desde hace mucho, pero no lo recordaba, jajajaj.",
    "Entre enero y febrero de 2024 te conocí en el colegio, en las clases de refuerzo, y no fue algo previsto. Eras amiga de alguien que conocía, y ahí fue cuando supe de tu existencia. Siempre te veía con esa persona, y te hablaba, sí, pero solo para cosas pequeñas. No nos conocíamos mucho.",
    "No hablábamos mucho, la verdad, casi nada, por cosas que, bueno, ya debes de saber. En su momento tenía que haber cierta distancia. Sinceramente, nunca imaginé estar así contigo. Antes solo eras mi \"cuñada\", y míranos ahora, eres mi todo. 💗"
],

"Durante": [
    "Biennn, aquí viene el \"desarrollo\" de nuestra pequeña historia hasta la fecha.",
    "De octubre para adelante, 2025, empezamos a hablar mucho más, pero en serio, muuuuchooo más, jajaja. Todo aún eran bromas, risas, solamente amigos más cercanos con un poco más de confianza. Dejamos esa distancia que teníamos que mantener antes de lado, porque ya no había nada que nos haya impedido hablar normal.",
    "Poco a poco nos fuimos haciendo más cercanos: hablábamos de nuestros problemas, nos molestábamos mutuamente, te cuidaba, me cuidabas, salíamos juntos del colegio, abrazos, besos, tomadas de mano... Hubo muchos rumores de nosotros, ¿pero y eso qué? Creo que, al fin y al cabo, tuvieron razón, jajaja."
],

"Después": [
    "Okey, ya vamos terminando, mi niña hermosa. Ahora toca la última parte, lo más bonito de todo.",
    "Ese hermoso 17 de diciembre de 2025, donde supimos todo, donde ya no tuvimos miedo... bueno, yo ya no tuve miedo de actuar. Te fui a dejar a tu casa, estábamos cerca, te tenía abrazada, a punto de irme, pero te pregunté: ¿Lo hago o no? Tú toda confundida, jajaj, y bueno, poco a poco me fui acercando hasta que por fin te besé. Pensé que no sería correspondido, pero fue todo lo contrario. Desde ahí todo fue mucho mejor: me gustaste, te gusté, llegué feliz a mi casa, no te imaginas cuánto.",
    "Quedamos para conocernos un poco más. Pasaron los días, y cada que nos veíamos no parecía que fuésemos solo amigos, estábamos beso y beso, jaja, hasta ese hermoso 25 de diciembre. Navidad, mi mejor Navidad, donde todo fue oficial. Salimos a caminar por ahí y llegamos al parque. No podía esperar más, no me importó que sea un día festivo, porque, sinceramente, que tú me dijeras que sí iba a ser mi mejor regalo, y lo fue. Te hice la pregunta y me respondiste con un tranquilo: sí, sí quiero."
],

"Infinito": [
    "Desde ese día hasta el día de hoy me has hecho muy feliz, mi amor, y espero que yo también te esté haciendo feliz. Gracias por todas las risas, los dramas, los berrinches, esas noches... gracias por todos los buenos y malos momentos. Gracias simplemente por existir, mi amor, gracias por estar siempre conmigo cuando lo necesito, y no quiero que dudes en pedirme ayuda cuando tú lo necesites. Tal vez no tenga la respuesta a todo, pero siempre estaré ahí para ti, mi niña hermosa. Aún nos queda mucho por recorrer, y lo único que pido es hacerlo a tu lado. Pueden haber problemas en el futuro, pero podemos solucionarlos. No te prometo estar siempre contigo, te prometo estar contigo hasta donde me lo permitas. No te digo \"te amo con el corazón\", te digo \"te amo con el alma\", porque el corazón muere, el alma siempre está presente.",
    "Espero que este pequeño detalle te haya gustado, porque si no, voy a llorar, jajaj. Te amo mucho, mi niña hermosa 💗. Espero que tengas un lindo día, tarde y noche. Besito para ti, simplemente por existir.",
    "Te amo, mi niña bella. Feliz San Valentín.",
    "Atte.: Tu niño."
],

"The end": [
    "27/10/26: No sé si siquiera leas todo esto, pero creo que todo llegó hasta aquí, te agradezco mucho por todo lo que me diste, por todos los momentos lindos, pero creo que ya es momento de dejar eso atras, porque ya me dí cuenta que no volverá a pasar nada entre nosotros. No olvidaré nada de lo que vivimos, pero solo me queda dar un paso al costado por completo de tu vida, por mas que me duela. Intente hacerte sentir amada, para que veas que de verdad habia alguien que te amaba tal y como eres, que no te juzgaba, y que no te iba a dejar sola, dí lo mejor de mí para que te sintiras bien, pero no sé porque no fue suficiente. Ya tengo en claro que no me amas, y duele como mierda, tú no me extrañas, porque si lo hicieras, me hubieras hablado o me hubieras buscado, pero no lo hiciste, y eso`duele porque no sabes lo mucho que yo te extraño, pero como ya te dije, mejor doy un paso al costado, y no insistiré ni molestaré mas. Yo sé tal vez q no soy valiente para decirtelo directamente, pero hablar contigo ya se me hace algo muy dificil, así que te digo todo por aquí. Te amaré lo mas silenciosamente que pueda y no te volveré a molestar, solo espero que seas muy feliz con alguien que de verdad sientas que es el ideal para tí, sigue esforzandote cada día más y nunca dejes de ser esa niña hermosa que eres, te apoyaré siempre en silencio, cuidate, y hasta pronto.",
    "25/10/26: Hola mi niña, sí, para mí aún sigues siendo mi niña hermosa. De todo corazón espero que te esté yendo muy bien en todo este tiempo que no hemos hablado, ojala no hayas descuidado tus estudios, matemática ya no tienes q llevarlo este año, yo sé que tú puedes, tú puedes con todo porque eres una niña fuerte, pero recuerda que aún que puedas con todo, hay veces que uno no puede con todo solo, espero que puedas trabajar en eso, porque sabes que nunca estaras sola.<br><br>Me hubiera gustado seguir contigo, ayudandote y apoyandote en todo lo que hubiese estado a mi alcance, porque la verdad lo unico que queria (y sigo queriendo) es que estes bien, y bueno por esa misma razon fue que acepte tu decisión, pero por mi parte nunca dejé de amarte, hasta el día de hoy no sabes como veo nuestras fotos y solo digo \"Quisiera que volvamos a ser solo nosotros...\", sé que es algo tonto tal vez, pero contigo sentia una conexión hermosa, sentia que contigo podia ser yo mismo, pero tal vez eso a tí no te gustaba mucho, la verdad es que no sé, pero a pesar de todo eso, sigo amandote y esperandote.<br><br>No te voy a mentir, hasta hoy no logro entender el porque de tu decisión, o porque tu repentino cambio de sentimientos, y la verdad si duele, mas que nada por esas cosas que me dijiste que veias y te contaron, y nunca me las dijiste para conversarlas, pero te juro que apesar de eso no sé porque no puedo sacarte de mi cabeza, y es que no puedo olvidarte.<br><br>Te juro que tengo unas ganas malditas de hablarte, pero no puedo, no me atrevo porque sé que tú no sientes lo mismo que yo, y no quiero incomodarte, aun que ya me has dicho que no te incomoda, pero no sé. Te voy a ser sincero, hace unas semanas un amigo me presentó a alguien, y acepté en conocerla, sin esperar nada la verdad, y bien tenia razón, es chevere, pero simplemente no era tú, y no podia sentir nada, así que solo le dejé de hablar porque no queria nada, pero ¿Por qué te cuento esto? Porque quiero que sepas que no es por ella, es por ti, porque no puedo olvidarte, y no sé si algún día lo logre, y por mas gente que conozca, no va a ser lo mismo que contigo, porque tú eres única, y no hay nadie como tú. No decesito a alguien mas, te necesito a tí, y hubiese querido que tú siguieras necesitando que sea yo. Todos los días reviso mi celular pensando que tal vez me hayas hablado, peor cuando estoy en clases, porque un compañero tiene el mismo sonido de notificación que tenia en tu chat, y es como que me emociono pero tambien me asusto, luego veo que no has sido tú y bueno... se siente feito.<br><br>No quiero incomodarte, y si es que no te gusta que escriba todo esto solo dimelo porfavor, y no lo haré mas, pero si es que me dejas, me gustaria seguir escribiendote y contandote mis días. Si sientes un día que no puedes mas, hablame, porque te prometí siempre estar para tí, y pienso cumplirlo. No olvides nunca lo que siento por tí, y si es que llegas a sentir lo mismo que yo pero por alguien mas, quisiera saber y que me lo cuentes, porque no quisiera estar demostrandote todo esto mientras que tú sientes algo por alguien mas, porque creo que no seria lo correcto, ni para tí, ni para mí, ni para la otra persona.<br><br>Bueno, eso era todo lo que queria decirte, espero que estes bien, y que tengas un lindo día, tarde o noche. Nunca olvides lo mucho que te amo mucho mi niña hermosa, y que siempre estaré para tí, cuidate mucho."
]
};

const rueda = document.getElementById("rueda");
const botones = rueda.children;
const total = botones.length;
const angulo = 360 / total;
const profundidad = 180;
let indice = 0;

const indicesFrase = {};
const contenedorFrases = document.getElementById("frase");
const cajaFrase = document.getElementById("frase-box");

let escribiendo = false;
let intervaloEscritura = null;
let idEscritura = 0;

/* Cancela cualquier escritura anterior */
function cancelarEscritura() {
    idEscritura++;

    if (intervaloEscritura !== null) {
        clearInterval(intervaloEscritura);
        intervaloEscritura = null;
    }

    escribiendo = false;
    cajaFrase.style.pointerEvents = "auto";
}

/* Actualiza la rueda */
function actualizarRueda() {
    cancelarEscritura();

    for (let i = 0; i < total; i++) {
        const offset = (i - indice + total) % total;
        const rotacion = (i - indice) * angulo;

        botones[i].style.transform =
            `rotateY(${rotacion}deg) translateZ(${profundidad}px) scale(${offset === 0 ? 1 : 0.75})`;

        botones[i].style.opacity = offset === 0 ? "1" : "0.2";
    }

    const nombreBoton = botones[indice].textContent.trim();

    indicesFrase[nombreBoton] = 0;
    contenedorFrases.innerHTML = "";
    cajaFrase.scrollTop = 0;

    mostrarSiguienteFrase();
}

/* Cambia de sección */
function cambiarIndice(direccion) {
    indice = (indice + direccion + total) % total;
    actualizarRueda();
}

/* Escribe el texto permitiendo HTML (<br>) y evitando intervalos simultáneos */
function escribirTexto(texto, elemento, callback) {
    cancelarEscritura();

    const miId = idEscritura;
    escribiendo = true;
    cajaFrase.style.pointerEvents = "none";

    let i = 0;
    elemento.innerHTML = "";

    intervaloEscritura = setInterval(() => {
        if (miId !== idEscritura) return;

        // Se usa slice para ir mostrando el texto progresivamente sin romper etiquetas <br>
        elemento.innerHTML = texto.slice(0, i + 1);
        i++;

        cajaFrase.scrollTop = cajaFrase.scrollHeight;

        if (i >= texto.length) {
            clearInterval(intervaloEscritura);
            intervaloEscritura = null;
            escribiendo = false;
            cajaFrase.style.pointerEvents = "auto";

            if (callback) callback();
        }
    }, 28);
}

/* Avanza a la siguiente frase */
function avanzarFrase() {
    if (escribiendo) return;

    mostrarSiguienteFrase();
}

/* Muestra la siguiente frase de la sección */
function mostrarSiguienteFrase() {
    if (escribiendo) return;

    const claveActual = botones[indice].textContent.trim();

    const lista = frases[claveActual];

    if (!lista) return;

    if (indicesFrase[claveActual] === undefined) {
        indicesFrase[claveActual] = 0;
    }

    const idx = indicesFrase[claveActual];

    if (idx < lista.length) {
        const p = document.createElement("p");
        contenedorFrases.appendChild(p);

        escribirTexto(lista[idx], p, () => {
            indicesFrase[claveActual]++;
        });
    }
}

/* Control de los botones de la rueda */
for (const b of botones) {
    b.addEventListener("click", () => {
        if (escribiendo) return;

        mostrarSiguienteFrase();
    });
}

/* Carga inicial */
window.addEventListener("load", () => {
    const loader = document.getElementById("loader");
    const contenido = document.getElementById("contenido");

    setTimeout(() => {
        loader.style.opacity = "0";

        setTimeout(() => {
            loader.style.display = "none";
            contenido.style.opacity = "1";
            actualizarRueda();
        }, 600);
    }, 400);
});

/* Fondo interactivo de corazones */
const canvas = document.getElementById("corazones");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const corazones = Array.from({ length: 30 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 8 + 6,
    speed: Math.random() * 0.8 + 0.3,
    opacity: Math.random() * 0.6 + 0.3
}));

function animarCorazones() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    corazones.forEach(c => {
        c.y -= c.speed;
        c.x += Math.sin(c.y * 0.02) * 0.5;

        if (c.y < -20) {
            c.y = canvas.height + 20;
            c.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.globalAlpha = c.opacity;
        ctx.beginPath();

        ctx.moveTo(c.x, c.y);

        ctx.bezierCurveTo(
            c.x - c.size,
            c.y - c.size,
            c.x - c.size * 2,
            c.y + c.size / 3,
            c.x,
            c.y + c.size * 2
        );

        ctx.bezierCurveTo(
            c.x + c.size * 2,
            c.y + c.size / 3,
            c.x + c.size,
            c.y - c.size,
            c.x,
            c.y
        );

        ctx.fillStyle = "#f43f5e";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#e11d48";
        ctx.fill();
        ctx.restore();
    });

    requestAnimationFrame(animarCorazones);
}

animarCorazones();
</script>

</body>
</html>

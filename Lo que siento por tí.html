<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lo que siento por ti</title>

<style>
  :root {
    --primary: #46b1ef;
    --primary-glow: rgba(47, 49, 148, 0.712);
    --secondary: #8b5cf6;
    --bg-dark: #0f1016;
    --card-bg: rgba(255, 255, 255, 0.07);
    --text-main: #f8fafc;
    --text-sub: #cbd5e1;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at top center, #1b1e4b 0%, #0d0222 100%);
    color: var(--text-main);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    overflow-x: hidden;
    padding: 30px 15px;
  }

  #corazones {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0;
  }

  /* Pantalla de Carga */
  #loader {
    position: fixed; inset: 0; background: var(--bg-dark); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 15px; z-index: 100; transition: opacity 0.6s ease;
    font-size: 1.2rem; letter-spacing: 2px; color: #e2e8f0;
  }
  .spinner {
    width: 40px; height: 40px; border: 3px solid rgba(255, 255, 255, 0.1);
    border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tarjetas Generales */
  .main-card, .diary-card {
    position: relative; z-index: 10; width: 100%; max-width: 650px;
    background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 24px; padding: 30px 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); display: flex; flex-direction: column; align-items: center;
    opacity: 0; transition: opacity 0.8s ease; margin-bottom: 25px;
  }
  .diary-card { display: none; animation: fadeIn 0.5s ease forwards; }

  h1, .diary-card h2 {
    font-weight: 700; background: linear-gradient(135deg, #ffffff);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 35px rgb(140, 0, 255);
  }
  h1 { font-size: clamp(24px, 5vw, 38px); margin-bottom: 20px; }
  .diary-card h2 { font-size: clamp(20px, 4vw, 28px); margin-bottom: 15px; }

  /* Rueda 3D */
  #escena { width: 100%; height: 80px; perspective: 1000px; display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
  #rueda { width: 200px; height: 50px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #rueda button {
    position: absolute; inset: 0; border: none; background: linear-gradient(135deg, #a855f7);
    color: white; font-size: 1.1rem; font-weight: 600; border-radius: 50px; cursor: pointer;
    box-shadow: 0 4px 20px var(--primary-glow); transition: all 0.5s ease;
  }

  /* Controles de Rueda */
  .controles { display: flex; gap: 15px; margin-bottom: 25px; }
  .btn-control {
    background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
    color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.95rem; cursor: pointer; transition: all 0.3s ease;
  }
  .btn-control:hover { background: rgba(255, 255, 255, 0.25); transform: translateY(-2px); }

  /* Cuadro de Frases y Diario Contenido */
  #frase-box, .diary-content {
    width: 100%; height: 220px; background: rgba(0, 0, 0, 0.25); border-radius: 16px; padding: 20px;
    border: 1px solid rgba(255, 255, 255, 0.05); overflow-y: auto; scroll-behavior: smooth;
    text-align: center; color: var(--text-sub); font-size: 1.05rem; line-height: 1.6;
  }
  #frase-box { display: flex; flex-direction: column; position: relative; cursor: pointer; }

  /* Barra de Scroll Personalizada */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(168, 85, 247, 0.5); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(168, 85, 247, 0.8); }

  #frase p { margin-bottom: 12px; animation: fadeIn 0.4s ease forwards; }

  /* Tira de Fechas Deslizables */
  .diary-dates {
    display: flex; flex-wrap: nowrap; gap: 10px; overflow-x: auto; width: 100%;
    padding-bottom: 10px; margin-bottom: 15px; justify-content: flex-start; scroll-behavior: smooth;
  }
  .date-btn {
    background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15);
    color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-size: 0.9rem;
    cursor: pointer; white-space: nowrap; flex-shrink: 0; transition: all 0.3s ease;
  }
  .date-btn:hover { background: rgba(168, 85, 247, 0.4); transform: translateY(-2px); }
  .date-btn.active { background: #a855f7; border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); font-weight: 600; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>

<body>

<canvas id="corazones"></canvas>

<div id="loader">
  <div class="spinner"></div>
  <span>Solo espera...</span>
</div>

<!-- SECCIÓN PRINCIPAL: RUEDA -->
<div class="main-card" id="contenido">
  <h1>Lo que siento por ti</h1>

  <div id="escena">
    <div id="rueda">
      <button>Holi</button>
      <button>Antes</button>
      <button>Durante</button>
      <button>Después</button>
      <button>Infinito</button>
      <button>¿The end?</button>
    </div>
  </div>

  <div class="controles">
    <button class="btn-control" onclick="cambiarIndice(-1)">← Anterior</button>
    <button class="btn-control" onclick="cambiarIndice(1)">Siguiente →</button>
  </div>

  <div id="frase-box" onclick="avanzarFrase()">
    <div id="frase"></div>
  </div>
</div>

<!-- SECCIÓN SECUNDARIA: DIARIO (Se abre al elegir "¿The end?") -->
<div class="diary-card" id="diaryCard">
  <h2>Amandote en silencio</h2>
  <div class="diary-dates" id="diaryDatesContainer"></div>
  <div class="diary-content" id="diaryContent">
  </div>
</div>

<script>

/* ==========================================
   1. DATOS (FRASES Y DIARIO)
   ========================================== */
const diarioFechas = {
    "22/10/26": "No sé si leas esto, pero aún así lo escribo, esto es una pequeña forma de hablarte y de no hablarte a la vez, y es que extraño contarte mis días, y bueno, esta es una buena manera de hacerlo (o eso creo yo)",
};

const frases = {
    "Holi": [
        "Hola mi niña hermosa. ¿Cómo estas? Espero que muy bien ...",
        "Buenoooo este es un pequeño proyecto que hice para expresar lo que siento por ti de una forma diferente y divertida, espero que te guste y te saque una sonrisa",
        "Te preguntaras: ¿Que piñatas es todo esto? pues ¿Recuerdas que me pedistes una pagina donde pongas tus emociones y te dé frases?",
        "Pues tomé esa idea, y lo convertir en algo un poco mejor (espero), es un recorrido de lo que hemos pasado juntos, el como me enamoré de tí, y a su vez, es un recordatorio de lo mucho que te amo",
        "Así que sin nada mas que decir, espero te guste este detalle, y que nunca olvides lo mucho que te amo, y lo importante que eres para mi",
        "Pasa a la siguiente parte para empezar"
    ],
    "Antes": [
        "Hablaré de la primera vez que nos conocimos, y de que tengo memoria, porque al parecer nos conocíamos desde hace mucho, pero no lo recordaba jajajaj",
        "Entre enero a febrero, 2024, te conocí en el colegio, clases de refuerzo, y no fue algo previsto, eras amiga de alguien que conocía, y ahí fue cuando supe de tu existencia, siempre te veia con esa persona, te hablaba si, pero solo para cosas pequeñas, no nos conociamos mucho.",
        "No hablabamos mucho la verdad, casi nada, por cosas que bueno, ya debes de saber, en su momento tenia que haber cierta distancia, sinceramente nunca imaginé estar así contigo, antes solo eras mi ''cuñada'', y miranos ahora, eres mi todo 💗"
    ],
    "Durante": [
        "Biennn, aquí viene el ''desarrollo'' de nuestra pequeña historia hasta la fecha",
        "De octubre para delante, 2025, empezamos a hablar mucho más, pero en serio, muuuuchooo más jajaja, todo aún eran bromas, risas, solamente amigos más cercanos con un poco mas de confianza, dejamos esa distancia que teniamos que mantener antes de lado, porque ya no habia nada que nos hay impedido hablar normal.", 
        "Poco a poco nos fuimos siendo más cercanos, hablamos de nuestros problemas, nos molestabamos mutuamente, te cuidaba, me cuidabas, salíamos juntos del colegio, abrazos, besos, tomadas de mano, hubieron muchos rumores de nosotros, pero y eso que? Creo q al fin y al cabo tuvieron razón jajaja."
    ],
    "Después": [
        "Okey ya vamos terminando mi niña hermosa, ahora toca la última parte, lo más bonito de todo",
        "Ese hermoso 17 de diciembre,  2025, dónde supimos todo, dónde ya no tuvimos miedo, bueno, yo ya no tuve miedo de actuar, te fui a dejar a tu casa, estábamos cerca, te tenía abrazada, a punto de irme, pero te pregunté: ¿Lo hago o no? Tú toda confundida jajaj, y bueno, poco a poco me fui acercando, hasta que por fin te besé, pensé que no sería correspondido, pero fue todo lo contrario, desde ahí todo fue mucho mejor, me gustaste, te guste, llegué feliz a mi casa, no te imaginas cuánto.",
        "Quedamos para conocernos un poco más, pasaron los días, y cada q nos veíamos no parecía q fuésemos solo amigos, estábamos beso y beso jaja, hasta ese hermoso 25 de diciembre, navidad, mi mejor navidad, dónde todo fue oficial, salimos a caminar por ahí, y llegamos al parque, no podía esperar más, no me importó que sea un día festivo, porque sinceramente, que tú me digas que sí, iba a ser mi mejor regalo, y lo fue, te hice la pregunta, y me respondistes con un tranquilo: si, si quiero."
    ],
    "Infinito": [
        "Desde ese día hasta el día de hoy, me has hecho muy feliz mi amor, y espero que yo tambien te esté haciendo feliz, gracias por todas las risas, los dramas, los berrinches, esas noches, gracias por todos los buenos y malos momentos, gracias simplemente existir mi amor, gracias por estar siempre conmigo cuando lo necesito, y no quiero que dudes en pedirme ayuda cuando tú lo necesites, tal vez no tenga la respuesta a todo, pero siempre estaré ahí para tí mi niña hermosa. Aún nos queda mucho por recorrer, y lo único que pido es hacerlo a tu lado, pueden haber problemas en el futuro, pero podemos solucionarlo, no te prometo estar siempre contigo, te prometo estar contigo hasta donde me lo permitas, no te digo ''te amo con el corazón'' te digo ''te amo con el alma'' porque el corazón muere, el alma siempre está presente.",
        "Espero este pequeño detalle te haya gustado, porque sino voy a llorar jajaj, te amo mucho mi niña hermosa 💗, espero tengas un lindo día, tarde y noche, besito pa tí, simplemente por existir",
        "Te amo mi niña bella. Feliz San Valentín ",
        "Atte: Tu niño."
    ]
};

/* ==========================================
   2. LÓGICA DE LA RUEDA Y NAVEGACIÓN
   ========================================== */
const rueda = document.getElementById("rueda");
const botones = rueda.children;
const total = botones.length;
const angulo = 360 / total;
const profundidad = 180;
let indice = 0;

const indicesFrase = {};
const contenedorFrases = document.getElementById("frase");
const cajaFrase = document.getElementById("frase-box");
const diaryCard = document.getElementById("diaryCard");
let escribiendo = false;

function actualizarRueda() {
    for (let i = 0; i < total; i++) {
        const offset = (i - indice + total) % total;
        let rotacion = (i - indice) * angulo;

        botones[i].style.transform = `rotateY(${rotacion}deg) translateZ(${profundidad}px) scale(${offset === 0 ? 1 : 0.75})`;
        botones[i].style.opacity = offset === 0 ? "1" : "0.2";
        botones[i].style.pointerEvents = offset === 0 ? "auto" : "none";
    }

    const nombreBoton = botones[indice].textContent.trim();

    if (nombreBoton === "¿The end?") {
        cajaFrase.style.display = "none";
        diaryCard.style.display = "flex";
        inicializarDiario();
    } else {
        cajaFrase.style.display = "flex";
        diaryCard.style.display = "none";
        indicesFrase[nombreBoton] = 0;
        contenedorFrases.innerHTML = "";
        cajaFrase.scrollTop = 0;
        mostrarSiguienteFrase();
    }
}

function cambiarIndice(direccion) {
    indice = (indice + direccion + total) % total;
    actualizarRueda();
}

function anterior() { cambiarIndice(-1); }
function siguiente() { cambiarIndice(1); }

function escribirTexto(texto, elemento, callback) {
    escribiendo = true;
    let i = 0;
    elemento.textContent = "";
    const intervalo = setInterval(() => {
        elemento.textContent += texto.charAt(i);
        i++;
        cajaFrase.scrollTop = cajaFrase.scrollHeight;
        if (i >= texto.length) {
            clearInterval(intervalo);
            escribiendo = false;
            if (callback) callback();
        }
    }, 28);
}

function avanzarFrase() {
    if (escribiendo) return;
    mostrarSiguienteFrase();
}

function mostrarSiguienteFrase() {
    const claveActual = botones[indice].textContent.trim();
    if (claveActual === "¿The end?") return;

    const lista = frases[claveActual];
    if (!lista) return;

    if (!indicesFrase[claveActual]) indicesFrase[claveActual] = 0;
    let idx = indicesFrase[claveActual];

    if (idx < lista.length) {
        const p = document.createElement("p");
        contenedorFrases.appendChild(p);
        escribiendo = true;
        escribirTexto(lista[idx], p, () => { indicesFrase[claveActual]++; });
    }
}

for (let b of botones) {
    b.addEventListener("click", () => {
        if (!escribiendo && botones[indice].textContent.trim() !== "¿The end?") {
            mostrarSiguienteFrase();
        }
    });
}

/* ==========================================
   3. INICIALIZAR EL DIARIO POR FECHAS
   ========================================== */
function inicializarDiario() {
    const container = document.getElementById("diaryDatesContainer");
    const contentBox = document.getElementById("diaryContent");
    container.innerHTML = "";

    let esPrimero = true;

    for (const [fecha, texto] of Object.entries(diarioFechas)) {
        const btn = document.createElement("button");
        btn.className = "date-btn";
        btn.textContent = fecha;

        btn.onclick = () => {
            document.querySelectorAll(".date-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            contentBox.textContent = texto;
        };

        container.appendChild(btn);

        if (esPrimero) {
            btn.classList.add("active");
            contentBox.textContent = texto;
            esPrimero = false;
        }
    }
}

/* ==========================================
   4. ANIMACIÓN Y CARGA INICIAL
   ========================================== */
window.addEventListener("load", () => {
    const loader = document.getElementById("loader");
    const contenido = document.getElementById("contenido");

    setTimeout(() => {
        loader.style.opacity = "0";
        setTimeout(() => {
            loader.style.display = "none";
            contenido.style.opacity = "1";
            actualizarRueda();
        }, 600);
    }, 400);
});

// Fondo Interactivo de Corazones
const canvas = document.getElementById("corazones");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const corazones = Array.from({ length: 30 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 8 + 6,
    speed: Math.random() * 0.8 + 0.3,
    opacity: Math.random() * 0.6 + 0.3
}));

function animarCorazones() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    corazones.forEach(c => {
        c.y -= c.speed;
        c.x += Math.sin(c.y * 0.02) * 0.5;

        if (c.y < -20) {
            c.y = canvas.height + 20;
            c.x = Math.random() * canvas.width;
        }

        ctx.save();
        ctx.globalAlpha = c.opacity;
        ctx.beginPath();
        ctx.moveTo(c.x, c.y);
        ctx.bezierCurveTo(c.x - c.size, c.y - c.size, c.x - c.size * 2, c.y + c.size / 3, c.x, c.y + c.size * 2);
        ctx.bezierCurveTo(c.x + c.size * 2, c.y + c.size / 3, c.x + c.size, c.y - c.size, c.x, c.y);
        ctx.fillStyle = "#f43f5e";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "#e11d48";
        ctx.fill();
        ctx.restore();
    });
    requestAnimationFrame(animarCorazones);
}
animarCorazones();
</script>

</body>
</html>
